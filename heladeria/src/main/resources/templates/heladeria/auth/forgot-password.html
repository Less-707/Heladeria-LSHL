<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heladería | Recuperar Contraseña</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <link rel="stylesheet" th:href="@{/plugins/fontawesome-free/css/all.min.css}">
  <link rel="stylesheet" th:href="@{/dist/css/adminlte.min.css}">
  <style>
    .login-page { background: linear-gradient(135deg, #f8e1f4 0%, #ffe4b5 50%, #b5e8f8 100%); }
    .login-logo a { color: #e05cad; font-weight: 700; font-size: 2rem; }
    .card { border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.10); }
    .btn-primary { background: #e05cad; border-color: #e05cad; }
  </style>
</head>
<body class="hold-transition login-page">
<div class="login-box">
  <div class="login-logo"><a>🍦 Heladería</a></div>
  <div class="card">
    <div class="card-body login-card-body">
      <p class="login-box-msg">Recupera tu contraseña</p>
      <div th:if="${success}" class="alert alert-success text-center" th:text="${success}"></div>
      <div th:if="${error}" class="alert alert-danger text-center" th:text="${error}"></div>
      <form th:action="@{/forgot-password}" method="post">
        <div class="input-group mb-3">
          <input type="email" name="email" class="form-control" placeholder="Correo electrónico" required>
          <div class="input-group-append"><div class="input-group-text"><i class="fas fa-envelope"></i></div></div>
        </div>
        <div class="row">
          <div class="col-12">
            <button type="submit" class="btn btn-primary btn-block">Enviar contraseña</button>
          </div>
        </div>
      </form>
      <p class="mt-3 mb-1"><a th:href="@{/login}" style="color:#e05cad;">Volver al login</a></p>
    </div>
  </div>
</div>
<script th:src="@{/plugins/jquery/jquery.min.js}"></script>
<script th:src="@{/plugins/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/dist/js/adminlte.min.js}"></script>
</body>
</html>
