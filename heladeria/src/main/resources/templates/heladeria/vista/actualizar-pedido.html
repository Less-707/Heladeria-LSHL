<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heladería | Editar Pedido</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <link rel="stylesheet" th:href="@{/plugins/fontawesome-free/css/all.min.css}">
  <link rel="stylesheet" th:href="@{/dist/css/adminlte.min.css}">
  <style>body,.content-wrapper{background:#fdf6fb!important}.card{border:none!important;border-radius:12px;box-shadow:0 2px 10px rgba(224,92,173,0.07)}.card-header{background:#fff!important;border-bottom:1px solid #f4d0ea!important;padding:16px 24px!important;border-radius:12px 12px 0 0!important}.card-title{color:#2d3748;font-weight:600;font-size:1rem;margin:0}.main-sidebar{background:#3d1a2e!important}.breadcrumb{background:transparent;padding:0}.breadcrumb-item a{color:#e05cad}.btn-primary{background:#e05cad;border-color:#e05cad}.btn-primary:hover{background:#c44b96}.form-control:focus{border-color:#e05cad;box-shadow:0 0 0 .2rem rgba(224,92,173,.25)}.btn-secondary{background:#f7f8fc;color:#4a5568;border-color:#e2e8f0}</style>
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">
  <nav class="main-header navbar navbar-expand navbar-white navbar-light">
    <ul class="navbar-nav"><li class="nav-item"><a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a></li><li class="nav-item d-none d-sm-inline-block"><a th:href="@{/heladeria/index}" class="nav-link">Inicio</a></li></ul>
  </nav>
  <aside class="main-sidebar sidebar-dark-primary elevation-4">
    <a th:href="@{/heladeria/index}" class="brand-link"><img th:src="@{/dist/img/AdminLTELogo.png}" alt="Logo" class="brand-image img-circle elevation-3" style="opacity:.8"><span class="brand-text font-weight-light">🍦 Heladería</span></a>
    <div class="sidebar">
      <div class="user-panel mt-3 pb-3 mb-3 d-flex"><div class="image"><img th:src="@{/dist/img/user2-160x160.jpg}" class="img-circle elevation-2" alt="User"></div><div class="info"><a href="#" class="d-block" th:text="${session.usuarioLogueado?.nombreCompleto ?: 'Usuario'}">Usuario</a></div></div>
      <nav class="mt-2"><ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu">
        <li class="nav-item"><a th:href="@{/heladeria/listado_sabores}" class="nav-link"><i class="nav-icon fas fa-ice-cream"></i><p>Sabores</p></a></li>
        <li class="nav-item"><a th:href="@{/pedidos}" class="nav-link active"><i class="nav-icon fas fa-shopping-cart"></i><p>Pedidos</p></a></li>
        <li class="nav-item"><a th:href="@{/produccion}" class="nav-link"><i class="nav-icon fas fa-industry"></i><p>Producción</p></a></li>
        <li class="nav-item"><a th:href="@{/pedidos/estadistica}" class="nav-link"><i class="nav-icon fas fa-chart-pie"></i><p>Estadísticas</p></a></li>
        <li class="nav-header"></li><li class="nav-item"><a th:href="@{/logout}" class="nav-link"><i class="nav-icon far fa-circle text-danger"></i><p>Salir</p></a></li>
      </ul></nav>
    </div>
  </aside>
  <div class="content-wrapper">
    <div class="content-header"><div class="container-fluid"><div class="row mb-2">
      <div class="col-sm-6"><h1 class="m-0" style="color:#2d3748;">Editar Pedido</h1></div>
      <div class="col-sm-6"><ol class="breadcrumb float-sm-right"><li class="breadcrumb-item"><a th:href="@{/heladeria/index}">Inicio</a></li><li class="breadcrumb-item"><a th:href="@{/pedidos}">Pedidos</a></li><li class="breadcrumb-item active">Editar</li></ol></div>
    </div></div></div>
    <section class="content"><div class="container-fluid"><div class="row justify-content-center"><div class="col-md-8">
      <div class="card">
        <div class="card-header"><h3 class="card-title"><i class="fas fa-pencil-alt mr-2" style="color:#e05cad;"></i>Modificar Pedido</h3></div>
        <div class="card-body">
          <form th:action="@{/pedidos/actualizar}" th:object="${pedido}" method="post">
            <input type="hidden" th:field="*{pedidoId}">
            <div class="form-group">
              <label>Sabor *</label>
              <select th:field="*{saborId}" class="form-control">
                <option value="">-- Selecciona un sabor --</option>
                <option th:each="sabor : ${sabores}" th:value="${sabor.id}" th:text="${sabor.nombre + ' ($' + sabor.precio + ')'}">Sabor</option>
              </select>
              <div th:if="${#fields.hasErrors('saborId')}" class="text-danger small" th:errors="*{saborId}"></div>
            </div>
            <div class="form-group">
              <label>Descripción *</label>
              <input type="text" th:field="*{descripcion}" class="form-control">
              <div th:if="${#fields.hasErrors('descripcion')}" class="text-danger small" th:errors="*{descripcion}"></div>
            </div>
            <div class="form-row">
              <div class="col-md-6 form-group">
                <label>Fecha y Hora *</label>
                <input type="datetime-local" th:field="*{fechaHora}" class="form-control">
                <div th:if="${#fields.hasErrors('fechaHora')}" class="text-danger small" th:errors="*{fechaHora}"></div>
              </div>
              <div class="col-md-6 form-group">
                <label>Estado *</label>
                <select th:field="*{estado}" class="form-control">
                  <option value="pendiente">🕐 Pendiente</option>
                  <option value="entregado">✅ Entregado</option>
                  <option value="cancelado">❌ Cancelado</option>
                </select>
                <div th:if="${#fields.hasErrors('estado')}" class="text-danger small" th:errors="*{estado}"></div>
              </div>
            </div>
            <div class="mt-3">
              <button type="submit" class="btn btn-primary"><i class="fas fa-save mr-1"></i> Actualizar</button>
              <a th:href="@{/pedidos}" class="btn btn-secondary ml-2"><i class="fas fa-times mr-1"></i> Cancelar</a>
            </div>
          </form>
        </div>
      </div>
    </div></div></div></section>
  </div>
  <footer class="main-footer"><strong>Copyright &copy; 2026 <a href="#" style="color:#e05cad;">Heladería</a>.</strong></footer>
  <aside class="control-sidebar control-sidebar-dark"></aside>
</div>
<script th:src="@{/plugins/jquery/jquery.min.js}"></script>
<script th:src="@{/plugins/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/dist/js/adminlte.js}"></script>
</body>
</html>
